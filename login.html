<!DOCTYPE html>
<html lang="pt-br">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Guardião Escolar - Acesso</title>
   <link rel="stylesheet" href="/css/login/style.css">
</head>

<body>
   <main class="app-screen">

      <header class="header">
         <div class="header-logo-container">
            <div>
               <svg class="header-icon" viewBox="0 0 24 24" fill="none">
                  <path d="M12 2.5 4 5.6v6.1c0 4.7 3.3 8.2 8 9.8 4.7-1.6 8-5.1 8-9.8V5.6L12 2.5Z" stroke="#1F5D50"
                     stroke-width="1.6" stroke-linejoin="round"></path>
                  <path d="M8.6 12.1l2.4 2.4 4.4-4.6" stroke="#1F5D50" stroke-width="1.6" stroke-linecap="round"
                     stroke-linejoin="round"></path>
               </svg>
            </div>

            <h1>Guardião Escolar</h1>
         </div>

      </header>

      <section class="main-content">
         <h1>Área da escola</h1>
         <p>Acesso só para responsáveis autorizados pela direção.</p>

         <form action="/login" method="POST" class="form">

            <div class="form-input-container">
               <label for="email" class="form-label">E-mail</label>
               <input type="email" id="email" placeholder="coordenacao@escola.edu.br" required class="form-input">
            </div>

            <div class="form-input-container">
               <label for="password" class="form-label">Senha</label>

               <div class="password-container">
                  <input type="password" id="password" placeholder="•••••••••" required class="form-input">
                  <div class="password-visible hide"></div>
               </div>
            </div>

            <button type="submit" class="button" id="submit">Entrar</button>
            <a href="" class="password-forget">Esqueci minha senha</a>
         </form>
      </section>

   </main>

   <script src="./js/passwordVisible.js"></script>

</body>

</html>
