<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Área da escola — Guardião Escolar</title>
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg" />
    <link rel="stylesheet" href="../css/estilo.css" />
  </head>
  <body>
    <main class="pagina" id="conteudo">
      <a class="marca" href="../index.html">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2.5 4 5.6v6.1c0 4.7 3.3 8.2 8 9.8 4.7-1.6 8-5.1 8-9.8V5.6L12 2.5Z" stroke="#1F5D50" stroke-width="1.6" stroke-linejoin="round" />
        </svg>
        <span>Guardião Escolar</span>
      </a>

      <h1>Área da escola</h1>
      <p class="subtitulo">Acesso apenas para responsáveis autorizados pela direção.</p>

      <!-- POST /api/sessao -> cria sessão e redireciona para denuncias.html -->
      <form action="/api/sessao" method="post">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required autocomplete="username" placeholder="coordenacao@escola.edu.br" />
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required autocomplete="current-password" minlength="8" />
        </div>

        <span class="erro" id="erro-login" role="alert">
          <!-- mensagem genérica de propósito: não revela se o e-mail existe -->
        </span>

        <button type="submit" class="botao">Entrar</button>
      </form>

      <a class="link-discreto" href="#">Esqueci minha senha</a>

      <div class="aviso aviso--neutro" style="margin-top: 26px">Não existe autocadastro. Os acessos são criados pelo administrador do sistema a pedido da direção da escola.</div>

      <footer class="rodape">
        <p><a href="../index.html">Voltar ao site público</a></p>
      </footer>
    </main>

    <script src="../js/app.js"></script>
  </body>
</html>
