<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Área da escola — Guardião Escolar</title>
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg" />
    <link rel="stylesheet" href="../css/estilo.css" />
  </head>
  <body>
    <main class="pagina" id="conteudo">
      <a class="marca" href="../index.html">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2.5 4 5.6v6.1c0 4.7 3.3 8.2 8 9.8 4.7-1.6 8-5.1 8-9.8V5.6L12 2.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
          <path d="M8.6 12.1l2.4 2.4 4.4-4.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Guardião Escolar</span>
      </a>

      <h1>Área da escola</h1>
      <p class="subtitulo">Acesso apenas para responsáveis autorizados pela direção.</p>

      <!-- POST /api/sessao -> cria sessão e vai para denuncias.html. O js/app.js envia por fetch;
         sem JavaScript, o servidor redireciona e volta com ?erro= quando dá errado. -->
      <form id="form-login" action="/api/sessao" method="post">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required autocomplete="username" placeholder="coordenacao@escola.edu.br" />
        </div>

        <div class="campo">
          <label for="senha">Senha</label>

          <div class="campo-senha">
            <input type="password" id="senha" name="senha" required autocomplete="current-password" />

            <button type="button" class="alternar-senha" aria-label="Mostrar senha" aria-pressed="false" aria-controls="senha">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <!-- mensagem genérica de propósito: não revela se o e-mail existe -->
        <span class="erro" id="erro-login" role="alert"></span>

        <button type="submit" class="botao">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 17l5-5-5-5" />
            <path d="M15 12H3" />
            <path d="M12 3h6a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-6" />
          </svg>
          Entrar
        </button>
      </form>

      <p class="link-discreto">Esqueceu a senha? Peça uma senha nova ao administrador do sistema.</p>

      <div class="aviso aviso--neutro" style="margin-top: 26px">Não existe autocadastro. Os acessos são criados pelo administrador do sistema a pedido da direção da escola.</div>

      <footer class="rodape">
        <p><a href="../index.html">Voltar ao site público</a></p>
      </footer>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/mostrar-senha.js"></script>
  </body>
</html>
