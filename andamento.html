<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Andamento da denúncia — Guardião Escolar</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body>
    <a class="pular-para-conteudo" href="#conteudo">Pular para o conteúdo</a>

    <main class="pagina" id="conteudo">
      <a class="voltar" href="consultar.html">&larr; Consultar outro código</a>

      <!-- Preenchido por js/app.js com o resultado de POST /api/denuncias/consulta.
         Nenhum dado que identifique pessoas envolvidas aparece aqui (RF13). -->
      <div id="andamento" hidden>
        <h1 class="numero" id="andamento-protocolo"></h1>
        <p class="subtitulo" id="andamento-resumo"></p>

        <p id="andamento-status"></p>

        <h2 style="margin-top: 26px">Histórico</h2>
        <ol class="linha-tempo" id="andamento-historico"></ol>
      </div>

      <div class="aviso aviso--neutro" style="margin-top: 26px">A escola lê o que você escreveu, mas não tem como saber quem você é. Guarde o código para voltar aqui depois.</div>

      <footer class="rodape">
        <p>A situação piorou? Registre uma <a href="denuncia.html">nova denúncia</a>. Em caso de perigo imediato, ligue 190.</p>
      </footer>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
